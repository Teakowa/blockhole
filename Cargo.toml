[package]
name = "blockhole"
version = "0.2.0"
edition = "2024"

[workspace]
members = [
    ".",
    "crates/blockhole-core",
    "plugins/blockhole-cloudflare",
    "plugins/blockhole-nginx",
    "plugins/blockhole-plugin-aws-waf",
]
resolver = "2"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
blockhole-core = { path = "crates/blockhole-core" }
blockhole-plugin-cloudflare = { path = "plugins/blockhole-cloudflare" }
blockhole-plugin-nginx = { path = "plugins/blockhole-nginx" }
blockhole-plugin-aws-waf = { path = "plugins/blockhole-plugin-aws-waf" }
clap = { version = "4.5", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
proptest = "1.6"
regex = "1.11"

[[bin]]
name = "blockhole"
path = "src/main.rs"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
