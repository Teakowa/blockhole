[package]
name = "blockhole-plugin-aws-waf"
version = "0.2.0"
edition = "2024"

[dependencies]
aws-config = "=1.8.18"
aws-sdk-wafv2 = "=1.120.0"
blockhole-core = { path = "../../crates/blockhole-core" }
chrono = { version = "0.4", features = ["serde"] }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread"] }
toml = "1.1"
