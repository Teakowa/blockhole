[package]
name = "blockhole-plugin-cloudflare"
version = "0.2.0"
edition = "2024"

[dependencies]
blockhole-core = { path = "../../crates/blockhole-core" }
chrono = { version = "0.4", features = ["serde"] }
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
toml = "1.1"
url = "2.5"
